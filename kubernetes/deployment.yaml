apiVersion: apps/v1
kind: Deployment
metadata:
  name: deal-bzh-app
  labels:
    app: deal-bzh
    component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deal-bzh
      component: web
  template:
    metadata:
      labels:
        app: deal-bzh
        component: web
    spec:
      containers:
      - name: php-fpm
        image: YOUR_REGISTRY/deal-bzh:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9000
          name: php-fpm
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: deal-bzh-secrets
              key: db-host
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: deal-bzh-secrets
              key: db-name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: deal-bzh-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: deal-bzh-secrets
              key: db-password
        - name: DB_PORT
          value: "3306"
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: deal-bzh-config
              key: app-env
        volumeMounts:
        - name: logs
          mountPath: /var/www/html/logs
        - name: cache
          mountPath: /var/www/html/data/cache
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - php
            - -r
            - "if (file_exists('/var/www/html/vendor/autoload.php')) { exit(0); } exit(1);"
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - php
            - -r
            - "if (file_exists('/var/www/html/vendor/autoload.php')) { exit(0); } exit(1);"
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: logs
        emptyDir: {}
      - name: cache
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: deal-bzh-php-fpm
  labels:
    app: deal-bzh
    component: web
spec:
  type: ClusterIP
  ports:
  - port: 9000
    targetPort: 9000
    protocol: TCP
    name: php-fpm
  selector:
    app: deal-bzh
    component: web


